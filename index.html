<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi Portafolio Profesional | Ariel Ávila</title>
  <meta name="description" content="Portafolio profesional de Ariel Ávila: proyectos, habilidades y formas de contacto." />
  <link rel="stylesheet" href="styles.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h1>Mi Portafolio Profesional</h1>
    <nav>
      <ul>
        <li><a href="#sobre-mi">Sobre mí</a></li>
        <li><a href="#proyectos">Proyectos</a></li>
        <li><a href="#contacto">Contacto</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section id="sobre-mi">
      <h2>Sobre mí</h2>
      <p>Soy Ariel Ávila, estudiante de programación. Me apasiona crear sitios web y aprender nuevas tecnologías.</p>
    </section>

    <section id="proyectos">
      <h2>Proyectos</h2>

      <div class="proyectos-controles">
        <input type="text" id="buscador-proyectos" placeholder="Buscar proyecto..." />
        <select id="filtro-categoria">
          <option value="todos">Todas las categorías</option>
          <option value="web">Web</option>
          <option value="app">Aplicaciones</option>
          <option value="diseno">Diseño</option>
        </select>
      </div>

      <ul id="lista-proyectos"></ul>
    </section>

    <section id="contacto">
      <h2>Contacto</h2>
      <form id="formulario-contacto" novalidate>
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" required />

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required />

        <label for="mensaje">Mensaje:</label>
        <textarea id="mensaje" name="mensaje" rows="4" required></textarea>

        <button type="submit">Enviar</button>
        <p id="form-feedback" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Ariel Ávila - Todos los derechos reservados</p>
  </footer>
</body>
</html>
